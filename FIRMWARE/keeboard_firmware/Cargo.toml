[package]
name = "keeboard"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
rmk = { path = "../rmk/rmk", default-features = false, features = [
    "esp32s3_ble",
    "log",
    "storage",
    "vial"
] }
embassy-executor = { version = "0.10" }
esp-backtrace = { version = "0.20", features = ["esp32s3", "panic-handler", "println"] }
esp-hal = { version = "1.2.0-rc.0", features = ["esp32s3", "unstable"] }
esp-storage = { version = "0.10", features = ["embedded-storage", "esp32s3"] }
esp-alloc = { version = "0.11", features = ["esp32s3"] }
esp-println = { version = "0.18", features = ["esp32s3", "log-04"] }
esp-bootloader-esp-idf = { version = "0.6", features = ["esp32s3", "log-04"] }
esp-sync = { version = "0.3", features = ["esp32s3"] }

[build-dependencies]
embuild = "0.33"
cc = "1.2.9"

[[bin]]
name = "keeboard"
test = false
bench = false

[profile.dev.package.esp-storage]
opt-level = 3

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = 'thin'
opt-level = 3
overflow-checks = false